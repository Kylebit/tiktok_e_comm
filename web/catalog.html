<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>商品目录 · Orbit</title>
<link rel="stylesheet" href="/static/operations_shell.css"><link rel="stylesheet" href="/static/catalog_directory.css">
<script defer src="/static/operations_shell.js"></script><script defer src="/static/catalog_directory.js"></script></head>
<body data-core="catalog"><main class="catalog-page">
<h1>商品目录</h1>
<section id="catalogCopyNote" hidden></section>
<section id="catalogModeError" role="alert" hidden><span></span><button id="catalogModeRetry" type="button">重试连接</button></section>
<form id="catalogFilters"><input id="skuQ" aria-label="搜索 SKU、商品名称或规格" placeholder="搜索 SKU、商品名称或规格" disabled>
<select id="region" aria-label="站点筛选" disabled><option value="">全部站点</option><option>MY</option><option>TH</option><option>VN</option><option>PH</option><option>RU</option></select>
<select id="costStatus" aria-label="成本筛选" disabled><option value="">全部成本</option><option value="CONFLICT">成本待选择</option><option value="MISSING">未填成本</option></select>
<button type="submit" disabled>搜索</button><button id="resetFilters" type="button" disabled>重置</button></form>
<p id="coverage" class="muted"></p><p id="listMeta" role="status">正在连接目录…</p>
<div class="table-wrap"><table><thead><tr><th>主图</th><th>SKU</th><th>商品名称</th><th>规格</th><th>成本价（¥）</th><th>重量（g）</th></tr></thead><tbody id="tbody"><tr><td colspan="6">正在加载…</td></tr></tbody></table></div>
<nav class="pagination" aria-label="目录分页"><label>每页 <select id="pageSize" aria-label="每页数量" disabled><option value="25">25</option><option value="50" selected>50</option><option value="100">100</option></select> 条</label><button id="previousPage" type="button" disabled>上一页</button><span id="pageNumber"></span><button id="nextPage" type="button" disabled>下一页</button></nav>
</main></body></html>
