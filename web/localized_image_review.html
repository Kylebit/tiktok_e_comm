<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>多语言图片执行结果 · Orbit</title>
  <link rel="stylesheet" href="/static/localized_image_review.css?v=20260819-1">
</head>
<body data-human-review-surface="none">
  <main class="page-shell">
    <header class="hero">
      <div>
        <p class="eyebrow">LOCALIZED IMAGE RESULTS</p>
        <h1>多语言图片执行结果</h1>
        <p class="lead">这里只显示各国家语言图片的生成进度和结果。所有人工审核统一在商品发布中心完成。</p>
      </div>
      <a class="back-link" id="backToProduct" href="/new-product">返回商品发布中心</a>
    </header>

    <section class="control-panel" aria-labelledby="projectTitle">
      <div>
        <p class="eyebrow">PROJECT</p>
        <h2 id="projectTitle">图片 1、5、6、7 × 五种语言</h2>
        <p id="projectIdentity" class="muted">正在读取项目…</p>
      </div>
      <div class="actions">
        <button id="refreshReview" type="button">刷新当前状态</button>
      </div>
      <div id="reviewStatus" class="status" role="status" aria-live="polite">等待加载。</div>
    </section>

    <nav id="localeTabs" class="locale-tabs" aria-label="语言筛选"></nav>

    <section id="reviewGrid" class="review-grid" aria-live="polite"></section>

    <section class="handoff-panel">
      <div>
        <p class="eyebrow">SAFE HANDOFF</p>
        <h2>会话授权与技术执行已经分离</h2>
        <p>生成、妙手写回和平台回读只影响执行就绪状态；本页不承担人工审核。</p>
      </div>
      <code id="approvalDigest" hidden>内部授权状态</code>
    </section>
  </main>

  <dialog id="imageLightbox">
    <button id="closeLightbox" type="button" aria-label="关闭大图">×</button>
    <img id="lightboxImage" alt="放大预览">
  </dialog>
  <script src="/static/localized_image_review.js?v=20260819-1"></script>
</body>
</html>
