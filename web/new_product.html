  <title>Orbit Treasury 新品发布台</title>
  <link rel="stylesheet" href="/static/app.css">
  <style>

    @media (max-width: 980px) { .np-grid, .split { grid-template-columns: minmax(0, 1fr); } .np-grid > aside { position: static; max-height: none; } .workflow-rail { grid-template-columns: repeat(4, minmax(0, 1fr)); } }

<body>
  <header class="topbar">
    <a class="brand" href="/">TikTok Shop 控制台</a>
    <nav class="nav">
      <a href="/catalog">商品目录</a>
      <a href="/new-product" class="active">新品工作台</a>
      <a href="/sourcing">1688 选图</a>
      <a href="/images">主图优化</a>
      <a href="/promotions">促销</a>
    </nav>
  </header>

  <main class="container np-page">
    <div class="source-alert"><strong>Orbit Treasury 新品发布台</strong>一个商品、一条审核链路；所有外部写入都在最终确认后执行。</div>
    <h1>新品发布工作台</h1>
    <p class="hint">顶部显示唯一当前阶段，页面按来源、内容、生图、图片、价格、妙手和站点顺序推进。</p>
    <div id="sessionBar" class="session-bar"></div>

    <div class="np-grid">
      <aside class="np-card">
        <h2>输入</h2>
        <div class="np-form">
          <label>商品来源</label>
          <div class="source-mode">
            <label><input type="radio" name="sourceMode" value="miaoshou" checked>妙手采集箱</label>
            <label><input type="radio" name="sourceMode" value="1688">1688 货源</label>
            <label><input type="radio" name="sourceMode" value="auto">自动识别</label>
          </div>
          <label>链接或商品 ID</label>
          <input id="urlInput" placeholder="妙手采集箱 ID，例如 3828811808" value="">
          <label>海外同款链接 / 妙手采集箱详情 ID（可选，每行一个：Temu / Shopee / Lazada / Amazon / TikTok / ms:ID）</label>
          <textarea id="overseasInput" placeholder="https://www.temu.com/...&#10;ms:3746058817"></textarea>
          <button id="previewButton" class="btn-primary" onclick="loadPreview()">读取商品并开始审核</button>
          <div id="pipelineProgress" class="progress-card" style="display:none"></div>
          <div id="status" class="np-status"></div>
        </div>

        <div id="reviewStage" class="stage-card">
          <div class="stage-head"><h3>当前阶段</h3><span id="stageBadge" class="stage-badge">等待预览</span></div>
          <p id="stageHint" class="stage-hint">生成预览并完成页面中的审核项。</p>
          <div id="stageFlow" class="stage-flow"></div>
          <button id="stageButton" class="btn-primary" onclick="runStageAction()" disabled>先读取商品</button>
        </div>
      </aside>

      <section id="preview" class="np-card">
        <div class="empty">输入 1688 链接、商品 ID 或妙手采集箱 ID 后开始。</div>
      </section>
    </div>
  </main>
  <dialog id="imagePreviewDialog" class="image-preview-dialog" aria-labelledby="imagePreviewTitle">
    <div class="image-preview-head">
      <strong id="imagePreviewTitle">图片预览</strong>
      <button type="button" class="image-preview-close" aria-label="关闭预览" title="关闭预览" onclick="closeImagePreview()">×</button>
    </div>
    <div class="image-preview-body">
      <img id="imagePreviewFull" alt="">
    </div>
  </dialog>

  <script>
    var preview = null;
    var showAllImages = false;
    var pipelineState = [];
    var pipelineFailures = [];
    var miaoshouDraftPrepared = false;
    var packageDirty = false;
    var imageLoadState = {};
    var contentReviewFeedback = '';
    var contentReviewFeedbackError = false;
    var visionProposalFeedback = '';
    var visionProposalFeedbackError = false;
    var visionProposalStartedAt = 0;
    var visionProposalProgressTimer = null;
    var firstImagePreflightFeedback = '';
    var firstImageGenerationFeedback = '';
    var firstImageGenerationFeedbackError = false;
    var remainingImagesFeedback = '';
    var remainingImagesFeedbackError = false;
    var miaoshouImagesFeedback = '';
    var miaoshouImagesFeedbackError = false;
    var remainingGenerationPollTimer = null;
    var firstGenerationPollTimer = null;
    var imageReviewSaveTimer = null;
    var imageReviewSaveInFlight = false;
    var imageReviewDraftDirty = false;
    var imageReviewDraftRevision = 0;
    var finalImageDragUrl = '';
    var siteDraftPollTimer = null;
    var siteDraftPollAttempt = 0;
    var fxRateTimer = null;
    var FX_STORAGE_KEY = 'orbit_treasury_fx_rates_v1';
    var FX_MANUAL_KEY = 'orbit_treasury_fx_manual_v1';
    var DEFAULT_FX_RATES = {
      PHP: +(1 / 7.9).toFixed(6),
      MYR: 1.55,
      THB: +(1 / 4.9).toFixed(6),
      VND: +(1 / 3500).toFixed(8),
      USD: 7.2
    };
    var FX_LABELS = {
      PHP: '菲律宾 PHP',
      MYR: '马来西亚 MYR',
      THB: '泰国 THB',
      VND: '越南 VND',
      USD: '美元 USD'
    };
    var liveFxState = {
      rates: null,
      provider: '',
      as_of: '',
      live: false,
      stale: false,
      degraded: false,
      error: '',
      loading: false,
      fetched_at: ''
    };
    var claimPollTimer = null;
    var claimPollAttempt = 0;
    var SESSION_STORE_KEY = 'orbit_treasury_np_sessions_v2';
    var sessionsById = {};
    var sessionOrder = [];
    var activeSessionId = null;
    var sessionSeq = 1;

    function newSessionId() {
      return 'sess_' + Date.now().toString(36) + '_' + (sessionSeq++);
    }

    function blankSession(id) {
      return {
        id: id || newSessionId(),
        offerId: '',
        label: '新流程',
        urlInput: '',
        overseasInput: '',
        preview: null,
        showAllImages: false,
        pipelineState: [],
        pipelineFailures: [],
        miaoshouDraftPrepared: false,
        packageDirty: false,
        imageLoadState: {},
        contentPackageDraft: null,
        statusText: '',
        completed: false,
        updatedAt: Date.now()
      };
    }

    function loadSessionStore() {
      try {
        var raw = localStorage.getItem(SESSION_STORE_KEY);
        if (!raw) return;
        var data = JSON.parse(raw);
        sessionsById = data.sessions || {};
        sessionOrder = data.order || Object.keys(sessionsById);
        activeSessionId = data.activeId || (sessionOrder[0] || null);
        sessionSeq = data.seq || sessionOrder.length + 1;
      } catch (e) {
        sessionsById = {};
        sessionOrder = [];
        activeSessionId = null;
      }
    }

    function persistSessionStore() {
      try {
        localStorage.setItem(SESSION_STORE_KEY, JSON.stringify({
          sessions: sessionsById,
          order: sessionOrder,
          activeId: activeSessionId,
          seq: sessionSeq,
          savedAt: Date.now()
        }));
      } catch (e) {
        console.error('无法保存多商品会话', e);
        var status = document.getElementById('status');
        if (status) status.textContent = '本地会话缓存空间不足；服务器端商品状态仍然保留，请关闭不需要的并行标签后刷新。';
      }
    }

    function stopBackgroundTimers() {
      if (siteDraftPollTimer) { clearTimeout(siteDraftPollTimer); siteDraftPollTimer = null; }
      if (claimPollTimer) { clearTimeout(claimPollTimer); claimPollTimer = null; }
      if (remainingGenerationPollTimer) { clearTimeout(remainingGenerationPollTimer); remainingGenerationPollTimer = null; }
      if (firstGenerationPollTimer) { clearTimeout(firstGenerationPollTimer); firstGenerationPollTimer = null; }
      siteDraftPollAttempt = 0;
      claimPollAttempt = 0;
    }

    function captureActiveSession() {
      if (!activeSessionId || !sessionsById[activeSessionId]) return null;
      var sess = sessionsById[activeSessionId];
      var urlEl = document.getElementById('urlInput');
      var overseasEl = document.getElementById('overseasInput');
      var statusEl = document.getElementById('status');
      if (urlEl) sess.urlInput = urlEl.value;
      if (overseasEl) sess.overseasInput = overseasEl.value;
      if (statusEl) sess.statusText = statusEl.textContent || '';
      sess.preview = preview;
      sess.showAllImages = showAllImages;
      sess.pipelineState = pipelineState;
      sess.pipelineFailures = pipelineFailures;
      sess.miaoshouDraftPrepared = miaoshouDraftPrepared;
      sess.packageDirty = packageDirty;
      sess.imageLoadState = imageLoadState;
      if (preview && preview.offer_id) {
        sess.offerId = String(preview.offer_id);
        sess.label = String(preview.offer_id);
      } else if (sess.urlInput) {
        sess.label = (sess.urlInput.length > 28 ? sess.urlInput.slice(0, 28) + '…' : sess.urlInput);
      }
      if (preview && preview.site_drafts && preview.site_drafts.ready) {
        sess.completed = true;
      }
      sess.updatedAt = Date.now();
      persistSessionStore();
      return sess;
    }

    function applySession(sess) {
      stopBackgroundTimers();
      preview = sess.preview || null;
      showAllImages = !!sess.showAllImages;
      pipelineState = sess.pipelineState || [];
      pipelineFailures = sess.pipelineFailures || [];
      miaoshouDraftPrepared = !!sess.miaoshouDraftPrepared;
      packageDirty = !!sess.packageDirty;
      imageLoadState = sess.imageLoadState || {};
      document.getElementById('urlInput').value = sess.urlInput || '';
      document.getElementById('overseasInput').value = sess.overseasInput || '';
      setStatus(sess.statusText || '');
      renderProgress();
      if (preview) {
        render();
      } else {
        document.getElementById('preview').innerHTML = '<div class="empty">输入 1688 链接、商品 ID 或妙手采集箱 ID 后开始。</div>';
        var badge = document.getElementById('stageBadge');
        var hint = document.getElementById('stageHint');
        var button = document.getElementById('stageButton');
        var flow = document.getElementById('stageFlow');
        if (badge) badge.textContent = '等待预览';
        if (hint) hint.textContent = '生成预览并完成页面中的审核项。';
        if (flow) flow.innerHTML = '';
        if (button) {
          button.disabled = true;
          button.textContent = '先读取商品';
        }
        var card = document.getElementById('reviewStage');
        if (card) card.classList.remove('ready');
      }
      renderSessionBar();
    }

    function currentContentPackageDraft() {
      if (!activeSessionId || !sessionsById[activeSessionId] || !preview) return null;
      var draft = sessionsById[activeSessionId].contentPackageDraft;
      if (!draft || String(draft.offerId || '') !== String(preview.offer_id || '')) return null;
      return draft.review || null;
    }

    function captureContentPackageDraft() {
      if (!activeSessionId || !sessionsById[activeSessionId] || !preview) return;
      var contentRoot = document.querySelector('.content-package');
      if (!contentRoot) return;
      sessionsById[activeSessionId].contentPackageDraft = {
        offerId: String(preview.offer_id || ''),
        review: collectContentPackageReview(),
        updatedAt: Date.now()
      };
      sessionsById[activeSessionId].updatedAt = Date.now();
      persistSessionStore();
      var button = document.getElementById('contentReviewSaveButton');
      if (button) button.textContent = '保存内容审核（有未保存修改）';
      var status = document.getElementById('contentDraftStatus');
      if (status) status.textContent = '当前配方有未保存修改；页面刷新、汇率更新或切换商品不会丢失。';
    }

    function clearContentPackageDraft() {
      if (!activeSessionId || !sessionsById[activeSessionId]) return;
      sessionsById[activeSessionId].contentPackageDraft = null;
      persistSessionStore();
    }

    function renderSessionBar() {
      var bar = document.getElementById('sessionBar');
      if (!bar) return;
      var html = '<span class="session-label">并行上品</span>';
      sessionOrder.forEach(function(id) {
        var sess = sessionsById[id];
        if (!sess) return;
        var cls = 'session-tab' + (id === activeSessionId ? ' active' : '') + (sess.completed ? ' done' : '');
        var title = sess.label || sess.offerId || '新流程';
        html += '<button type="button" class="' + cls + '" onclick="switchSession(\'' + id + '\')">';
        html += '<span>' + esc(title) + (sess.completed ? ' · 已完成' : '') + '</span>';
        html += '<span class="x" title="关闭并清除缓存" onclick="event.stopPropagation(); closeSession(\'' + id + '\')">×</span>';
        html += '</button>';
      });
      html += '<div class="session-actions">';
      html += '<button type="button" class="btn-secondary" onclick="createSession()">+ 新建上品</button>';
      if (activeSessionId && sessionsById[activeSessionId] && sessionsById[activeSessionId].completed) {
        html += '<button type="button" class="btn-secondary" onclick="closeSession(activeSessionId)">关闭已完成流程</button>';
      }
      html += '</div>';
      bar.innerHTML = html;
    }

    function ensureAtLeastOneSession() {
      if (!sessionOrder.length) {
        var sess = blankSession();
        sessionsById[sess.id] = sess;
        sessionOrder = [sess.id];
        activeSessionId = sess.id;
        persistSessionStore();
      }
      if (!activeSessionId || !sessionsById[activeSessionId]) {
        activeSessionId = sessionOrder[0];
      }
    }

    function createSession() {
      captureActiveSession();
      var sess = blankSession();
      sessionsById[sess.id] = sess;
      sessionOrder.push(sess.id);
      activeSessionId = sess.id;
      persistSessionStore();
      applySession(sess);
      setStatus('已新建并行上品流程，可输入另一个商品。');
    }

    function switchSession(id) {
      if (!id || id === activeSessionId || !sessionsById[id]) return;
      captureActiveSession();
      activeSessionId = id;
      persistSessionStore();
      applySession(sessionsById[id]);
    }

    function closeSession(id) {
      id = id || activeSessionId;
      if (!id || !sessionsById[id]) return;
      var sess = sessionsById[id];
      var hasWork = !!(sess.preview || (sess.urlInput || '').trim());
      if (hasWork && !sess.completed) {
        if (!confirm('关闭并清除该商品流程缓存？未完成进度将丢失。')) return;
      }
      if (id === activeSessionId) stopBackgroundTimers();
      delete sessionsById[id];
      sessionOrder = sessionOrder.filter(function(x) { return x !== id; });
      if (!sessionOrder.length) {
        var fresh = blankSession();
        sessionsById[fresh.id] = fresh;
        sessionOrder = [fresh.id];
        activeSessionId = fresh.id;
        persistSessionStore();
        applySession(fresh);
        setStatus('已关闭流程。');
        return;
      }
      if (activeSessionId === id) {
        activeSessionId = sessionOrder[0];
      }
      persistSessionStore();
      applySession(sessionsById[activeSessionId]);
      setStatus('已关闭并清除该商品缓存。');
    }

    function bindSessionToOffer(offerId) {
      if (!offerId || !activeSessionId) return;
      offerId = String(offerId);
      var existingId = null;
      sessionOrder.forEach(function(id) {
        if (id === activeSessionId) return;
        var s = sessionsById[id];
        if (s && String(s.offerId || '') === offerId) existingId = id;
      });
      if (existingId) {
        // Merge into existing offer session: drop empty duplicate active
        var keep = sessionsById[existingId];
        keep.preview = preview;
        keep.urlInput = offerId;
        keep.offerId = offerId;
        keep.label = offerId;
        keep.updatedAt = Date.now();
        delete sessionsById[activeSessionId];
        sessionOrder = sessionOrder.filter(function(x) { return x !== activeSessionId; });
        activeSessionId = existingId;
        persistSessionStore();
        applySession(keep);
        setStatus('已切换到已有商品流程：' + offerId);
        return;
      }
      var sess = sessionsById[activeSessionId];
      sess.offerId = offerId;
      sess.label = offerId;
      sess.urlInput = offerId;
      sess.preview = preview;
      sess.updatedAt = Date.now();
      persistSessionStore();
      renderSessionBar();
    }

    function esc(s) {
      return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function imgSrc(url) {
      if (!url) return '';
      if (/^(data:|blob:|\/)/.test(url)) return url;
      return '/api/proxy-image?url=' + encodeURIComponent(url);
    }

    function markImageError(img) {
      var card = img && img.closest ? img.closest('.image-card') : null;
      if (card) card.classList.add('img-error');
      if (img && img.dataset) {
        imageLoadState[img.dataset.imgKey] = 'failed';
        updateImageProgressUi(img.dataset.imgScope);
      }
    }

    function markImageLoaded(img) {
      var card = img && img.closest ? img.closest('.image-card') : null;
      if (card) card.classList.remove('img-error');
      if (img && img.dataset) {
        imageLoadState[img.dataset.imgKey] = 'loaded';
        updateImageProgressUi(img.dataset.imgScope);
      }
    }

    function imageKey(scope, idx) {
      return scope + '-' + idx;
    }

    function imageStats(scope) {
      var nodes = Array.prototype.slice.call(document.querySelectorAll('img[data-img-scope="' + scope + '"]'));
      var stats = {total: nodes.length, loaded: 0, failed: 0, pending: 0};
      nodes.forEach(function(node) {
        var status = imageLoadState[node.dataset.imgKey] || 'pending';
        if (status === 'loaded') stats.loaded += 1;
        else if (status === 'failed') stats.failed += 1;
        else stats.pending += 1;
      });
      return stats;
    }

    function updateImageProgressUi(scope) {
      var host = document.querySelector('[data-image-progress="' + scope + '"]');
      if (!host) return;
      var stats = imageStats(scope);
      if (!stats.total) {
        host.innerHTML = '';
        return;
      }
      var done = stats.loaded + stats.failed;
      var pct = stats.total ? Math.round((done / stats.total) * 100) : 0;
      host.innerHTML =
        '<div class="image-progress"><div class="image-progress-fill" style="width:' + pct + '%"></div></div>' +
        '<div class="image-progress-meta">' +
        '<span><strong>已完成 ' + done + ' / ' + stats.total + '</strong></span>' +
        '<span>成功 ' + stats.loaded + ' 张</span>' +
        '<span>失败 ' + stats.failed + ' 张</span>' +
        '<span>加载中 ' + stats.pending + ' 张</span>' +
        (stats.failed ? '<button class="btn-secondary" onclick="retryFailedImages(\'' + scope + '\')">重试失败图片</button>' : '') +
        '</div>';
    }

    function updateAllImageProgressUi() {
      updateImageProgressUi('review');
      updateImageProgressUi('overseas');
    }

    function retryImage(scope, idx) {
      var img = document.querySelector('img[data-img-scope="' + scope + '"][data-img-idx="' + idx + '"]');
      if (!img) return;
      var card = img.closest('.image-card');
      if (card) card.classList.remove('img-error');
      imageLoadState[img.dataset.imgKey] = 'pending';
      var orig = img.getAttribute('data-orig-url') || '';
      var next = orig ? imgSrc(orig) : (img.getAttribute('data-base-src') || '');
      if (next) {
        img.setAttribute('data-base-src', next);
        img.src = next + (next.indexOf('?') >= 0 ? '&' : '?') + '_retry=' + Date.now();
      }
      updateImageProgressUi(scope);
    }

    function retryFailedImages(scope) {
      Array.prototype.slice.call(document.querySelectorAll('img[data-img-scope="' + scope + '"]')).forEach(function(img) {
        if ((imageLoadState[img.dataset.imgKey] || 'pending') === 'failed') {
          retryImage(scope, img.dataset.imgIdx);
        }
      });
    }

    function markPackageDirty() {
      packageDirty = true;
      syncPackageSaveUi();
    }

    function syncPackageSaveUi(message) {
      var button = document.getElementById('packageSaveButton');
      var note = document.getElementById('packageSaveState');
      if (button) {
        button.disabled = !packageDirty;
        button.textContent = packageDirty ? '保存尺寸重量并重算价格' : '尺寸重量已保存';
      }
      if (note) {
        note.textContent = message || (packageDirty ? '尺寸重量已修改，等待保存' : '当前尺寸重量已保存');
      }
    }

    function savePackageReview() {
      if (!packageDirty) {
        syncPackageSaveUi('当前尺寸重量已保存');
        return;
      }
      api('/api/new-product/review', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({offer_id: preview.offer_id, review: collectReview(false)})
      }).then(function(d) {
        if (!d.ok) { alert(d.error || '保存失败'); return; }
        preview = d;
        packageDirty = false;
        render();
        syncPackageSaveUi('尺寸重量已保存并已重算价格');

    function scheduleRemainingGenerationPoll() {
      if (remainingGenerationPollTimer) {
        clearTimeout(remainingGenerationPollTimer);
        remainingGenerationPollTimer = null;
      }
      var generation = (((preview || {}).content_package || {}).remaining_images_generation || {});
      if (!preview || (generation.status !== 'queued' && generation.status !== 'running')) return;
      remainingGenerationPollTimer = setTimeout(function() {
        api('/api/new-product/preview?offer_id=' + encodeURIComponent(preview.offer_id)).then(function(d) {
          if (!d.ok) throw new Error(d.error || '无法读取生成状态');

          var currentId = current.current_shot_id ? '正在处理 ' + current.current_shot_id + '；' : '';
          var generatedCount = ((d.content_package || {}).generated_review_images || []).length;
          if ((previousStatus === 'queued' || previousStatus === 'running') && current.status === 'completed_waiting_human_review' && generatedCount) {
            setStatus('本批图片生成完成，正在带你前往下方统一图片编排区。');

    function resetProgress(labels) {
      pipelineState = labels.map(function(label) { return {label: label, status: 'pending', message: ''}; });
      pipelineFailures = [];
      renderProgress();
    }

    function updateProgress(idx, status, message) {
      if (pipelineState[idx]) {
        pipelineState[idx].status = status;
        pipelineState[idx].message = message || '';
      }
      renderProgress();
    }

    function failProgress(idx, message) {
      var msg = message || 'Unknown error';
      if (pipelineState[idx]) pipelineState[idx].status = 'failed';
      pipelineFailures.push((pipelineState[idx] ? pipelineState[idx].label + ': ' : '') + msg);
      renderProgress();
    }

    function renderProgress() {
      var box = document.getElementById('pipelineProgress');
      if (!box) return;
      if (!pipelineState.length) {
        box.style.display = 'none';
        box.innerHTML = '';
        return;
      }
      box.style.display = 'block';
      var done = pipelineState.filter(function(s) { return s.status === 'done'; }).length;
      var pct = Math.round((done / pipelineState.length) * 100);
      var html = '<div class="progress-track"><div class="progress-fill" style="width:' + pct + '%"></div></div>';
      html += '<div class="step-list">';
      pipelineState.forEach(function(step) {
        var cls = step.status === 'pending' ? '' : step.status;
        html += '<div class="step-item ' + cls + '"><span class="step-dot"></span><span>' + esc(step.label);
        if (step.message) html += ' - ' + esc(step.message);
        html += '</span></div>';
      });
      html += '</div>';
      if (pipelineFailures.length) {
        html += '<div class="fail-list"><strong>失败项目</strong><br>' + pipelineFailures.map(esc).join('<br>') + '</div>';
      }
      box.innerHTML = html;
    }

    function loadPreview() {
      var rawUrl = document.getElementById('urlInput').value.trim();
      if (!rawUrl) { alert('请先输入商品链接或 ID'); return; }
      var modeNode = document.querySelector('input[name="sourceMode"]:checked');
      var sourceMode = modeNode ? modeNode.value : 'auto';
      var url = sourceMode === 'miaoshou' && /^\d+$/.test(rawUrl) ? 'ms:' + rawUrl : rawUrl;
      var button = document.getElementById('previewButton');
      button.disabled = true;
      showAllImages = false;
      resetProgress(['解析输入来源', '读取妙手/1688 商品数据', '抓取海外素材', '生成页面预览和价格审查']);
      updateProgress(0, 'running', '准备中');
      setStatus('正在读取商品数据并生成审核页面...');
      api('/api/new-product/preview', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({url: url, overseas_urls: overseasLines(), precollect: true})
      }).then(function(d) {
        updateProgress(0, 'done', 'Offer ' + (d.offer_id || ''));
        if (!d.ok) { failProgress(1, d.error || '预采集失败'); setStatus(d.error || '失败'); return; }
        updateProgress(1, d.precollect_error ? 'failed' : 'done', d.precollect_error || d.mode || '');
        if (d.precollect_error) pipelineFailures.push('妙手预采集: ' + d.precollect_error);
        preview = d;
        document.getElementById('urlInput').value = d.offer_id;
        bindSessionToOffer(d.offer_id);
        if (overseasLines().length) {
          updateProgress(2, 'running', '正在拉取公开素材');
          return saveOverseasLinks(true, true).then(function(ok) {

            updateProgress(3, 'done', '已渲染');
            setStatus('商品审核页面已准备：' + (preview.mode || 'preview'));
            render();
            applyLiveFxRates(false);
            captureActiveSession();
          });

        updateProgress(2, 'done', '无海外链接');
        updateProgress(3, 'done', '已渲染');
        setStatus('商品审核页面已准备：' + d.mode);
        render();
        applyLiveFxRates(false);
        captureActiveSession();
      }).catch(function(e) { failProgress(1, String(e)); setStatus(String(e)); }).finally(function() { button.disabled = false; });

    function readStoredFxRates() {
      try {
        var raw = localStorage.getItem(FX_STORAGE_KEY);
        if (!raw) return {};
        var parsed = JSON.parse(raw);
        return parsed && typeof parsed === 'object' ? parsed : {};
      } catch (e) {
        return {};
      }
    }

    function writeStoredFxRates(rates) {
      try {
        localStorage.setItem(FX_STORAGE_KEY, JSON.stringify(rates || {}));
      } catch (e) {}
    }

    function readManualFxCodes() {
      try {
        var raw = localStorage.getItem(FX_MANUAL_KEY);
        if (!raw) return {};
        var parsed = JSON.parse(raw);
        return parsed && typeof parsed === 'object' ? parsed : {};
      } catch (e) {
        return {};
      }
    }

    function writeManualFxCodes(map) {
      try {
        localStorage.setItem(FX_MANUAL_KEY, JSON.stringify(map || {}));
      } catch (e) {}
    }

    function markFxManual(code) {
      var map = readManualFxCodes();
      map[code] = true;
      writeManualFxCodes(map);
    }

    function clearFxManual(code) {
      var map = readManualFxCodes();
      delete map[code];
      writeManualFxCodes(map);
    }

    function currentFxRates() {
      var rates = Object.assign({}, DEFAULT_FX_RATES);
      var live = liveFxState.rates || {};
      Object.keys(live || {}).forEach(function(k) {
        var n = parseFloat(live[k]);
        if (n > 0) rates[k] = n;
      });
      var backend = ((preview || {}).pricing || {}).rates || ((preview || {}).review || {}).fx_rates || {};
      Object.keys(backend || {}).forEach(function(k) {
        var n = parseFloat(backend[k]);
        if (n > 0) rates[k] = n;
      });
      var stored = readStoredFxRates();
      var manual = readManualFxCodes();
      Object.keys(stored || {}).forEach(function(k) {
        if (!manual[k]) return;
        var n = parseFloat(stored[k]);
        if (n > 0) rates[k] = n;
      });
      return rates;
    }

    function collectFxRatesFromDom() {
      var rates = currentFxRates();
      Object.keys(DEFAULT_FX_RATES).forEach(function(code) {
        var el = document.getElementById('fxRate_' + code);
        if (!el) return;
        var n = parseFloat(el.value || '');
        if (n > 0) rates[code] = n;
      });
      return rates;
    }

    function fxStatusText() {
      if (liveFxState.loading) return '正在拉取实时汇率…';
      if (liveFxState.degraded || (!liveFxState.live && liveFxState.error)) {
        return '实时汇率获取失败，已使用默认汇率，可手动修改' + (liveFxState.error ? '（' + liveFxState.error + '）' : '');
      }
      if (liveFxState.stale) {
        return '实时源暂时不可用，已使用缓存汇率' + (liveFxState.as_of ? ' · 更新于 ' + liveFxState.as_of : '');
      }
      if (liveFxState.live) {
        return '已接入实时汇率' + (liveFxState.provider ? ' · ' + liveFxState.provider : '') +
          (liveFxState.as_of ? ' · ' + liveFxState.as_of : '');
      }
      return '使用可编辑默认汇率';
    }

    function renderFxRates(p) {
      var rates = currentFxRates();
      var live = liveFxState.rates || {};
      var manual = readManualFxCodes();
      var html = '<details class="fx-panel" open>';
      html += '<summary>汇率设置（CNY / 外币）</summary>';
      html += '<div class="fx-hint" id="fxStatusLine">' + esc(fxStatusText()) + '</div>';
      html += '<div class="sub-actions" style="margin-top:8px">';
      html += '<button type="button" class="btn-secondary" onclick="refreshLiveFxRates(true)">刷新实时汇率</button>';
      html += '<button type="button" class="btn-secondary" onclick="applyLiveFxRates(true)">用实时汇率覆盖全部</button>';
      html += '</div>';
      html += '<div class="fx-grid">';
      Object.keys(DEFAULT_FX_RATES).forEach(function(code) {
        var inv = rates[code] > 0 ? (1 / rates[code]) : 0;
        var liveVal = live[code];
        html += '<label>' + esc(FX_LABELS[code] || code);
        if (manual[code]) html += ' <span class="warn-pill">手动</span>';
        else if (liveVal) html += ' <span class="ok-pill">实时</span>';
        html += '<input id="fxRate_' + code + '" type="number" step="any" min="0" value="' + esc(rates[code]) +
          '" oninput="onFxRateInput(\'' + code + '\')" title="1 ' + code + ' = ? CNY">';
        html += '<span class="muted">当前使用：1 ' + code + ' = ' + (rates[code] || 0) + ' CNY';
        if (liveVal) html += '<br>实时：1 ' + code + ' = ' + liveVal + ' CNY';
        if (code !== 'USD' && inv) {
          html += '<br>1 CNY ≈ ' + inv.toFixed(code === 'VND' ? 0 : 2) + ' ' + code;
        }
        html += '</span></label>';
      });
      html += '</div>';
      html += '<div class="fx-hint">优先：手动覆盖 &gt; 实时汇率 &gt; 默认值。修改输入框会标记为手动并重算价格；刷新实时汇率不会覆盖已手动的币种。</div>';
      html += '</details>';
      return html;
    }

    function onFxRateInput(code) {
      if (code) markFxManual(code);
      var rates = collectFxRatesFromDom();
      writeStoredFxRates(rates);
      if (!preview) return;
      if (fxRateTimer) clearTimeout(fxRateTimer);
      fxRateTimer = setTimeout(function() {
        saveReview(false, true, 'fx');
      }, 180);
    }

    function applyLiveFxRates(forceAll) {
      if (!liveFxState.rates) return;
      var manual = forceAll ? {} : readManualFxCodes();
      if (forceAll) writeManualFxCodes({});
      var next = currentFxRates();
      Object.keys(liveFxState.rates).forEach(function(code) {
        if (!forceAll && manual[code]) return;
        var n = parseFloat(liveFxState.rates[code]);
        if (n > 0) next[code] = n;
      });
      writeStoredFxRates(next);
      if (preview && forceAll) saveReview(false, true, 'fx');
      else if (document.getElementById('preview')) render();
    }

    function refreshLiveFxRates(force) {
      liveFxState.loading = true;
      var status = document.getElementById('fxStatusLine');
      if (status) status.textContent = fxStatusText();
      return api('/api/exchange-rates' + (force ? '?refresh=1' : ''), { method: 'GET' }).then(function(d) {
        liveFxState.loading = false;
        if (!d || d.ok === false) {
          liveFxState.degraded = true;
          liveFxState.live = false;
          liveFxState.error = (d && d.error) || 'exchange-rates failed';
          if (status) status.textContent = fxStatusText();
          return d;
        }
        liveFxState.rates = d.rates || null;
        liveFxState.provider = d.provider || '';
        liveFxState.as_of = d.as_of || d.fetched_at || '';
        liveFxState.live = !!d.live;
        liveFxState.stale = !!d.stale;
        liveFxState.degraded = !!d.degraded || (!d.live && !!d.error);
        liveFxState.error = d.error || '';
        liveFxState.fetched_at = d.fetched_at || '';
        applyLiveFxRates(false);
        if (document.getElementById('fxStatusLine') || preview) {
          if (preview) render();
          else {
            var line = document.getElementById('fxStatusLine');
            if (line) line.textContent = fxStatusText();
          }
        }
        return d;
      }).catch(function(e) {
        liveFxState.loading = false;
        liveFxState.degraded = true;
        liveFxState.live = false;
        liveFxState.error = String(e);
        var line = document.getElementById('fxStatusLine');
        if (line) line.textContent = fxStatusText();
      });
    }

    function renderPricing(p) {
      var audit = (p || {}).audit || {};

    function currentFinalImageOrder() {
      var nodes = Array.prototype.slice.call(document.querySelectorAll('#finalImageList [data-final-url]'));
      if (nodes.length) return nodes.map(function(node) { return node.dataset.finalUrl; });

    function captureImageReviewDraftFromDom() {
      if (!preview) return;
      var review = preview.review = preview.review || {};
      var rows = (review.image_actions || []).map(function(img, idx) {
        var out = Object.assign({}, img);
        var action = document.querySelector('.imageAction[data-idx="' + idx + '"]');
        var note = document.querySelector('.imageNote[data-idx="' + idx + '"]');
        if (action) out.action = action.value;
        if (note) out.note = note.value;
        return out;
      });
      review.image_actions = rows;
      review.image_order = currentFinalImageOrder();
      imageReviewDraftDirty = true;
      captureActiveSession();
    }

    function queueImageReviewSave() {
      captureImageReviewDraftFromDom();
      refreshFinalImageBoard();
      imageReviewDraftRevision += 1;
      if (imageReviewSaveTimer) clearTimeout(imageReviewSaveTimer);
      imageReviewSaveTimer = setTimeout(flushImageReviewSave, 250);
      setStatus('图片选择已更新，正在自动保存到本机...');
    }

    function flushImageReviewSave() {
      if (!preview || imageReviewSaveInFlight) return;
      imageReviewSaveInFlight = true;
      var savingRevision = imageReviewDraftRevision;
      var payload = collectReview(false);
      api('/api/new-product/review', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({offer_id: preview.offer_id, review: payload})
      }).then(function(d) {
        if (!d.ok) throw new Error(d.error || '图片审核自动保存失败');
        if (savingRevision === imageReviewDraftRevision) {
          preview = d;
          imageReviewDraftDirty = false;
          updateReviewStage();
          captureActiveSession();
          setStatus('图片选择与顺序已自动保存到本机，尚未写入妙手。');
        } else {
          var localActions = (preview.review || {}).image_actions || [];
          var localOrder = (preview.review || {}).image_order || [];
          preview = d;
          preview.review.image_actions = localActions;
          preview.review.image_order = localOrder;
        }
      }).catch(function(e) {
        setStatus('图片审核自动保存失败：' + String(e.message || e) + '。页面会保留当前选择，请重试。');
      }).finally(function() {
        imageReviewSaveInFlight = false;
        if (savingRevision !== imageReviewDraftRevision) flushImageReviewSave();
      });
    }

    function startFinalImageDrag(event) {
      var item = event.currentTarget;
      finalImageDragUrl = item ? item.dataset.finalUrl : '';
      if (event.dataTransfer) {
        event.dataTransfer.effectAllowed = 'move';
        event.dataTransfer.setData('text/plain', finalImageDragUrl);
      }
    }

    function allowFinalImageDrop(event) {
      event.preventDefault();
      if (event.currentTarget) event.currentTarget.classList.add('drag-over');
    }

    function leaveFinalImageDrop(event) {
      if (event.currentTarget) event.currentTarget.classList.remove('drag-over');
    }

    function dropFinalImage(event) {
      event.preventDefault();
      var target = event.currentTarget;
      if (target) target.classList.remove('drag-over');
      var sourceUrl = finalImageDragUrl || (event.dataTransfer ? event.dataTransfer.getData('text/plain') : '');
      var targetUrl = target ? target.dataset.finalUrl : '';
      if (!sourceUrl || !targetUrl || sourceUrl === targetUrl) return;
      var order = currentFinalImageOrder().filter(function(url) { return url !== sourceUrl; });
      var targetIndex = order.indexOf(targetUrl);
      order.splice(targetIndex < 0 ? order.length : targetIndex, 0, sourceUrl);
      preview.review.image_order = order;
      imageReviewDraftDirty = true;
      refreshFinalImageBoard();
      queueImageReviewSave();
    }

    function moveFinalImageFromButton(button, delta) {
      var item = button && button.closest ? button.closest('[data-final-url]') : null;
      if (!item) return;
      var url = item.dataset.finalUrl;
      var order = currentFinalImageOrder();
      var from = order.indexOf(url);
      var to = from + delta;
      if (from < 0 || to < 0 || to >= order.length) return;
      var swap = order[to];
      order[to] = order[from];
      order[from] = swap;
      preview.review.image_order = order;
      imageReviewDraftDirty = true;
      refreshFinalImageBoard();
      queueImageReviewSave();
    }

    function removeUnifiedImage(button, event) {
      if (event) {
        event.preventDefault();
        event.stopPropagation();
      }
      if (!preview || !button || !button.closest) return;
      var item = button.closest('[data-final-url]');
      if (!item) return;
      var url = item.dataset.finalUrl || '';
      var kind = item.dataset.finalKind || '';
      var artifactId = item.dataset.artifactId || '';
      if (!url) return;
      preview.review = preview.review || {};
      preview.review.image_order = currentFinalImageOrder().filter(function(value) { return value !== url; });
      if (kind === 'generated') {
        var generatedRows = preview.review.generated_image_actions || [];
        generatedRows.forEach(function(row) {
          if (row.artifact_id === artifactId) row.miaoshou_action = 'remove';
        });
        refreshFinalImageBoard();
        persistGeneratedImageAction(artifactId, 'remove');
        return;
      }
      (preview.review.image_actions || []).forEach(function(row) {
        var rowUrl = String(row.output_url || row.url || '').trim();
        if (rowUrl === url) row.action = 'remove';
      });
      imageReviewDraftDirty = true;
      refreshFinalImageBoard();
      queueImageReviewSave();
    }

    function focusStoryboard(shotId) {
      var card = document.getElementById('storyboard-card-' + shotId);

      void card.offsetWidth;
      card.classList.add('review-focus');
      var decision = card.querySelector('.storyboardDecision');
      if (decision) decision.focus();
      setStatus('已定位到待审核分镜 ' + shotId + '。这里审核的是文字构图方案，通过后才会生成新图片。');
    }

    function collectStoryboardReviews() {
      var reviews = {};

        var shotId = node.dataset.shotId;
        var note = document.querySelector('.storyboardReviewNote[data-shot-id="' + shotId + '"]');
        reviews[shotId] = {
          decision: node.value || 'pending',
          note: note ? note.value.trim() : '',
          shot_type: node.dataset.shotType || ''
        };
      });
      return reviews;
    }

      var storyboardReviews = collectStoryboardReviews();

        var id = node.dataset.artifactId;
        var note = document.querySelector('.contentAssetNote[data-artifact-id="' + id + '"]');
        decisions[id] = {decision: node.value, note: note ? note.value : ''};
      });

        fact_card_approved: !!((document.getElementById('contentFactApproved') || {}).checked),
        planning_scope_approved: !!((document.getElementById('contentScopeApproved') || {}).checked),
        suite_approved: storyboardIds.length > 0 && storyboardIds.every(function(shotId) { return storyboardReviews[shotId].decision === 'approved'; }),

    function requestVisionProposal(revisionMode) {
      if (!preview) return;
      var refs = Array.prototype.slice.call(document.querySelectorAll('.identityRefCheckbox:checked')).map(function(node) { return node.dataset.url; });
      var total = Array.prototype.slice.call(document.querySelectorAll('.suiteTypeCount')).reduce(function(sum, node) { return sum + (parseInt(node.value || '0', 10) || 0); }, 0);
      var storyboardFeedback = {};
      var locallySatisfiedFeedback = {};
      if (revisionMode) {
        var storyboardReviews = collectStoryboardReviews();
        Object.keys(storyboardReviews).forEach(function(shotId) {
          if (storyboardReviews[shotId].decision === 'revise' && storyboardReviews[shotId].note) {
            var note = storyboardReviews[shotId].note;
            var overlayOnly = /^(?:图像中|图片中|最终图中)?\s*(?:需要|要|请)?\s*(?:出现|有|显示|添加|加上)?\s*(?:尺寸)?\s*(?:数字|尺寸数字|英文尺寸|尺寸标注)\s*[。！!]*$/.test(note);
            if (storyboardReviews[shotId].shot_type === 'size_card' && overlayOnly) {
              locallySatisfiedFeedback[shotId] = note;
            } else {
              storyboardFeedback[shotId] = note;
            }
          }
        });
        var reviseWithoutNote = Object.keys(storyboardReviews).filter(function(shotId) {
          return storyboardReviews[shotId].decision === 'revise' && !storyboardReviews[shotId].note;
        });
        if (reviseWithoutNote.length) {
          var missingMessage = '请先为 ' + reviseWithoutNote.join('、') + ' 填写具体修改意见。';
          var summary = document.getElementById('storyboardReviewSummary');
          if (summary) { summary.textContent = missingMessage; summary.style.color = '#8a1722'; }
          setStatus(missingMessage);
          return;
        }
        if (!Object.keys(storyboardFeedback).length) {
          if (Object.keys(locallySatisfiedFeedback).length) {
            var overlayLabel = '';
            var sizeItem = (((preview || {}).content_package || {}).suite || {}).items || [];
            sizeItem.some(function(item) {
              if (item.type === 'size_card' && item.final_overlay_label) {
                overlayLabel = item.final_overlay_label;
                return true;
              }
              return false;
            });
            var overlayMessage = '无需重新调用 AI，也不会再次消耗 Token。尺寸图最终会由本地程序自动添加数字' + (overlayLabel ? '：' + overlayLabel : '') + '。请核对上方“最终交付会有数字”，确认后把本张改为“通过”。';
            var overlaySummary = document.getElementById('storyboardReviewSummary');
            if (overlaySummary) { overlaySummary.textContent = overlayMessage; overlaySummary.style.color = '#145a32'; }
            setStatus(overlayMessage);
            return;
          }
          var noFeedbackMessage = '请先把有问题的分镜设为“需要修改”，并填写修改意见。';
          var emptySummary = document.getElementById('storyboardReviewSummary');
          if (emptySummary) { emptySummary.textContent = noFeedbackMessage; emptySummary.style.color = '#8a1722'; }
          setStatus(noFeedbackMessage);
          return;
        }
      }
      if (!refs.length) { alert('请先至少选择一张商品身份参考图'); return; }
      var confirmMessage = revisionMode
        ? '将把你对 ' + Object.keys(storyboardFeedback).length + ' 张分镜的修改意见、上一版分镜和本地规则一起发送给 AI。系统只采用这 ' + Object.keys(storyboardFeedback).length + ' 张的修订，其他已通过分镜保持不变；此步骤再次消耗 Token，但不会生成商品图片。是否继续？'
        : '将调用 ToAPI 视觉模型读取 ' + refs.length + ' 张参考图，并严格按照本地规则规划 ' + total + ' 张分镜。此步骤消耗 Token，但不会生成商品图片。是否继续？';
      if (!confirm(confirmMessage)) return;
      var button = document.getElementById(revisionMode ? 'storyboardReplanButton' : 'visionProposalButton');
      visionProposalFeedbackError = false;
      visionProposalStartedAt = Date.now();
      if (visionProposalProgressTimer) clearInterval(visionProposalProgressTimer);
      function updateVisionProgress() {
        var elapsed = Math.max(0, Math.floor((Date.now() - visionProposalStartedAt) / 1000));
        visionProposalFeedback = (revisionMode ? '正在按你的修改意见只修订 ' + Object.keys(storyboardFeedback).length + ' 张分镜，其他分镜保持不变' : '正在读取 ' + refs.length + ' 张参考图并规划 ' + total + ' 张分镜') + '，已等待 ' + elapsed + ' 秒。视觉规划通常需要 1–5 分钟；请保持本页打开，不要重复点击。';
        var feedback = document.getElementById('visionProposalFeedback');
        if (feedback) {
          feedback.style.display = '';
          feedback.className = 'planning-status pending';
          feedback.innerHTML = '<h3>' + (revisionMode ? 'AI 正在按意见修订分镜' : 'AI 正在规划分镜') + '</h3><p>' + esc(visionProposalFeedback) + '</p>';
        }
        if (button) button.textContent = 'AI 规划中 · ' + elapsed + ' 秒';
      }
      if (button) { button.disabled = true; button.classList.add('button-busy'); }
      updateVisionProgress();
      visionProposalProgressTimer = setInterval(updateVisionProgress, 1000);
      setStatus('AI 正在读取参考图并规划分镜；页面会显示已等待时间，完成后还会经过本地规则校验。');
      api('/api/new-product/content-package/vision-proposal', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          offer_id: preview.offer_id,
          reference_urls: refs,
          storyboard_feedback: storyboardFeedback
        })
      }).then(function(d) {
        if (!d.ok) { throw new Error(d.error || 'AI 分镜生成失败'); }
        if (d.proposal && d.proposal.vision_model_called === false && d.proposal.local_feedback_satisfied) {
          visionProposalFeedback = d.proposal.message || '该要求已由本地确定性后处理满足，无需重新调用 AI。';
          visionProposalFeedbackError = false;
          preview.content_package = d.content_package;
          render();
          setStatus(visionProposalFeedback);
          return;
        }
        visionProposalFeedback = '';
        visionProposalFeedbackError = false;
        preview.content_package = d.content_package;
        clearContentPackageDraft();
        render();
        setStatus((revisionMode ? 'AI 已按修改意见修订指定分镜，其他已通过分镜保持不变' : 'AI 分镜已生成') + '并通过本地规则校验；请审核修订后的分镜。');
      }).catch(function(e) {
        var detail = String(e.message || e);
        visionProposalFeedbackError = true;
        visionProposalFeedback = detail + ' 本次没有自动重试。请确认网络稳定后，再点击上方按钮手动重试一次。';
        var feedback = document.getElementById('visionProposalFeedback');
        if (feedback) {
          feedback.style.display = '';
          feedback.className = 'planning-status error';
          feedback.innerHTML = '<h3>AI 分镜未完成</h3><p>' + esc(visionProposalFeedback) + '</p>';
        }
        setStatus('AI 分镜未完成：' + detail);
      }).finally(function() {
        if (visionProposalProgressTimer) {
          clearInterval(visionProposalProgressTimer);
          visionProposalProgressTimer = null;
        }
        if (button) {
          button.disabled = false;
          button.classList.remove('button-busy');
          button.textContent = revisionMode ? '按修改意见只重做需要修改的分镜（消耗 Token）' : '重新尝试 AI 分镜规划（消耗 Token）';
        }
      });
    }

        }

        contentReviewFeedback = '保存失败：' + String(e.message || e);

    function collectReview(lockFields) {
      var sites = Array.prototype.slice.call(document.querySelectorAll('.siteCheck:checked')).map(function(x) { return x.value; });
      var imgs = (preview.review.image_actions || []).map(function(img, idx) {
        var a = document.querySelector('.imageAction[data-idx="' + idx + '"]');
        var n = document.querySelector('.imageNote[data-idx="' + idx + '"]');
        var out = Object.assign({}, img);
        out.action = a ? a.value : out.action;
        out.note = n ? n.value : out.note;
        return out;
      });
      return {
        selected_sites: sites,
        title: document.getElementById('titleInput').value,
        seller_sku: document.getElementById('sellerSku').value.replace(/\D/g, '').slice(-4),
        category: {name: document.getElementById('categoryInput').value},
        cost_cny: parseFloat(document.getElementById('costCny').value || '0'),
        weight_kg: parseFloat(document.getElementById('weightG').value || '0') / 1000,
        package_cm: [
          parseFloat(document.getElementById('dimL').value || '0'),
          parseFloat(document.getElementById('dimW').value || '0'),
          parseFloat(document.getElementById('dimH').value || '0')
        ],
        video_action: (document.getElementById('videoAction') || {}).value || 'none',
        support_cod: true,
        image_actions: imgs,
        image_order: currentFinalImageOrder(),
        selected_sku_keys: Array.prototype.slice.call(document.querySelectorAll('.sku-choice:checked')).map(function(node) { return node.dataset.skuKey; }),
        fx_rates: collectFxRatesFromDom(),
        fields_locked: !!lockFields
      };
    }

      }).then(function(d) {

        render();

        captureActiveSession();
      });

      saveReview(false, true, 'general');
    }

    function stageSnapshot() {
      return preview ? (preview.workflow || {}) : {steps: [], current_stage: 'source', blockers: []};
    }

    function renderStageFlow(snapshot) {
      var html = '';
      (snapshot.steps || []).forEach(function(step) {
        var cls = step.status === 'done' ? 'stage-step done' : ((step.status === 'current' || step.status === 'attention') ? 'stage-step current' : 'stage-step');
        html += '<div class="' + cls + '"><span class="dot"></span><div><div>' + esc(step.label) + '</div></div></div>';
      });
      if ((snapshot.blockers || []).length) {
        html += '<div class="blocked-sites"><strong>当前待处理</strong><br>' + esc(snapshot.blockers.join('；')) + '</div>';
      }
      return html;
    }

    function refreshPreviewState(quiet) {
      if (!preview || !preview.offer_id) return Promise.resolve(preview);
      if (imageReviewDraftDirty) captureImageReviewDraftFromDom();
      var localImageActions = imageReviewDraftDirty ? ((preview.review || {}).image_actions || []).map(function(row) { return Object.assign({}, row); }) : null;
      var localImageOrder = imageReviewDraftDirty ? ((preview.review || {}).image_order || []).slice() : null;
      return api('/api/new-product/preview', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({url: preview.offer_id, overseas_urls: overseasLines(), precollect: true})
      }).then(function(d) {
        if (!d.ok) throw new Error(d.error || '刷新状态失败');
        if (imageReviewDraftDirty) {
          d.review = d.review || {};
          d.review.image_actions = localImageActions;
          d.review.image_order = localImageOrder;
        }
        preview = d;
        render();
        if (!quiet) setStatus('已刷新当前阶段状态');
        return d;
      });
    }

    function updateReviewStage() {
      var card = document.getElementById('reviewStage');
      var badge = document.getElementById('stageBadge');
      var hint = document.getElementById('stageHint');
      var button = document.getElementById('stageButton');
      var flow = document.getElementById('stageFlow');
      if (!preview) return;
      miaoshouDraftPrepared = !!((preview.miaoshou_draft || {}).ready) && !((preview.miaoshou_draft || {}).written_to_miaoshou);
      var locked = !!((preview.review || {}).fields_locked);
      var written = !!((preview.miaoshou_draft || {}).written_to_miaoshou && (preview.miaoshou_draft || {}).verified);
      var claimState = preview.tiktok_claim || {};
      var claimed = !!claimState.claimed;
      var claimInProgress = !!claimState.in_progress;
      var siteReady = !!((preview.site_drafts || {}).ready);
      var siteDrafts = preview.site_drafts || {};
      var failedChecks = siteDrafts.failed_checks || {};
      var failedSummary = Object.keys(failedChecks).filter(function(region) {
        return (failedChecks[region] || []).length;
      }).map(function(region) {
        return region + ': ' + failedChecks[region].join(', ');
      }).join(' | ');
      var blockedCount = Object.keys((preview.tiktok_claim || {}).blocked_sites || {}).length;
      var snapshot = stageSnapshot();
      var currentStage = snapshot.current_stage || 'source';
      card.classList.toggle('ready', currentStage === 'miaoshou' || currentStage === 'channels');
      if (flow) flow.innerHTML = renderStageFlow(snapshot);
      badge.textContent = snapshot.current_label || '商品审核中';
      hint.textContent = (snapshot.blockers || []).length
        ? snapshot.blockers.join('；')
        : (siteReady ? '站点草稿已经生成并校验，等待发布审批。' : '当前阶段已就绪，可以继续。');
      button.disabled = false;
      var labels = {
        source: '去确认来源与规格',
        content: '去审核内容与图片配方',
        generation: '去完成整套生图',
        images: '去完成图片审核',
        commercial: '确认并锁定发布信息',
        miaoshou: miaoshouDraftPrepared ? '确认应用到妙手' : '预览妙手变更',
        channels: siteReady ? '站点草稿已就绪' : ((claimed || claimInProgress) ? '继续生成站点草稿' : '继续同步到 TikTok')
      };
      button.textContent = labels[currentStage] || '继续';
      var changeSummary = (preview.miaoshou_draft || {}).change_summary || {};
      var oldDraft = document.getElementById('draftPreview');
      if (oldDraft) oldDraft.remove();
      if (currentStage === 'miaoshou' && Object.keys(changeSummary).length) {
        card.insertAdjacentHTML('beforeend', renderDraftChangeSummary(changeSummary));
      }
      if (siteReady && activeSessionId && sessionsById[activeSessionId]) {
        sessionsById[activeSessionId].completed = true;
        persistSessionStore();
        renderSessionBar();
      }
    }

    function runStageAction() {
      if (!preview) return;
      var currentStage = ((preview.workflow || {}).current_stage || 'source');
      var sectionByStage = {source: 'sourceSection', content: 'contentSection', generation: 'contentSection', images: 'imageSection'};
      if (sectionByStage[currentStage]) {
        var target = document.getElementById(sectionByStage[currentStage]);
        if (target) target.scrollIntoView({behavior: 'smooth', block: 'start'});
        return;
      }
      if (pendingStageAction === 'drop-long-video') {
        applyLongVideoFallback();
        return;
      }
      if ((preview.site_drafts || {}).ready) {
        setStatus('站点草稿已生成，正在刷新状态...');
        refreshPreviewState(false).catch(function(e) {
          setStatus(String(e));
        });
        return;
      }
      if ((preview.tiktok_claim || {}).in_progress) {
        startClaimPolling('正在认领 TikTok 采集箱');
        return;
      }
      if ((preview.tiktok_claim || {}).claimed) {
        prepareSiteDrafts();
        return;
      }
      if ((preview.miaoshou_draft || {}).written_to_miaoshou) {
        continueAfterSecondReview();
        return;
      }
      if (currentStage === 'commercial' || !((preview.review || {}).fields_locked)) {
        saveReview(true);
        return;
      }
      if (miaoshouDraftPrepared) {
        commitMiaoshouDraft();
        return;
      }
      prepareMiaoshouDraft();
    }

    function renderDraftChangeSummary(summary) {
      return '<div id="draftPreview" class="draft-preview"><strong>即将应用到妙手</strong><div class="draft-preview-grid">' +
        '<span>标题：' + esc(summary.title || '-') + '</span>' +
        '<span>Seller SKU：' + esc(summary.seller_sku || '-') + '</span>' +
        '<span>重量：' + esc(summary.weight_g || 0) + ' g</span>' +
        '<span>包装：' + esc((summary.package_cm || []).join(' × ')) + ' cm</span>' +
        '<span>图片：来源 ' + esc(summary.source_image_count || 0) + ' + AI ' + esc(summary.generated_image_count || 0) + '</span>' +
        '<span>规格：' + esc(summary.selected_sku_count || 0) + ' 个；站点：' + esc(summary.selected_site_count || 0) + ' 个</span>' +
        '</div><p class="muted">确认后将一次写入并回读验证，不会直接发布商品。</p></div>';
    }

    function startSiteDraftPolling(reason) {
      if (siteDraftPollTimer) {
        clearTimeout(siteDraftPollTimer);
        siteDraftPollTimer = null;
      }
      siteDraftPollAttempt = 0;
      var button = document.getElementById('stageButton');
      function tick() {
        siteDraftPollAttempt += 1;
        refreshPreviewState(true).then(function(d) {
          if ((d.site_drafts || {}).ready) {
            if (siteDraftPollTimer) {
              clearTimeout(siteDraftPollTimer);
              siteDraftPollTimer = null;
            }
            siteDraftPollAttempt = 0;
            setStatus('站点草稿已生成并校验；当前阶段已刷新。');
            render();
            return;
          }
          if (siteDraftPollAttempt >= 30) {
            if (siteDraftPollTimer) {
              clearTimeout(siteDraftPollTimer);
              siteDraftPollTimer = null;
            }
            if (button) button.disabled = false;
            setStatus('站点草稿生成轮询超时，请稍后手动刷新。');
            render();
            return;
          }
          setStatus((reason || '正在生成站点草稿') + '，第 ' + siteDraftPollAttempt + ' 次轮询...');
          siteDraftPollTimer = setTimeout(tick, 2500);
        }).catch(function(e) {
          if (siteDraftPollAttempt >= 30) {
            if (siteDraftPollTimer) {
              clearTimeout(siteDraftPollTimer);
              siteDraftPollTimer = null;
            }
            if (button) button.disabled = false;
            setStatus('站点草稿轮询失败：' + String(e));
            render();
            return;
          }
          siteDraftPollTimer = setTimeout(tick, 2500);
        });
      }
      tick();
    }

    function prepareSiteDrafts() {
      var button = document.getElementById('stageButton');
      button.disabled = true;
      button.textContent = '正在生成站点草稿...';
      setStatus('正在写入站点价格、英文规格、库存和 COD 配置；不会发布。');
      refreshPreviewState(true).then(function(d) {
        if ((d.site_drafts || {}).ready) {

        return api('/api/new-product/site-drafts/prepare', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({offer_id: preview.offer_id})
        });
      }).then(function(d) {
        if (d && !d.ok) throw new Error(d.error || '站点草稿准备失败');
        startSiteDraftPolling('正在校验站点草稿');
      }).catch(function(e) {
        setStatus(String(e));
        button.disabled = false;
        button.textContent = '重试生成站点草稿';
      });
    }

    function startClaimPolling(reason) {
      if (claimPollTimer) {
        clearTimeout(claimPollTimer);
        claimPollTimer = null;
      }
      claimPollAttempt = 0;
      var button = document.getElementById('stageButton');
      function tick() {
        claimPollAttempt += 1;
        refreshPreviewState(true).then(function(d) {
          var claim = d.tiktok_claim || {};
          if (claim.claimed && !claim.in_progress) {
            if (claimPollTimer) {
              clearTimeout(claimPollTimer);
              claimPollTimer = null;
            }
            claimPollAttempt = 0;
            var blocked = Object.keys((claim.blocked_sites || {})).length;
            setStatus('已认领 TikTok 采集箱 ' + (claim.claimed_shop_count || 0) + ' 个店铺，' + blocked + ' 个站点待授权。');
            render();
            return;
          }
          if (!claim.in_progress && claim.last_error) {
            if (claimPollTimer) {
              clearTimeout(claimPollTimer);
              claimPollTimer = null;
            }
            if (button) button.disabled = false;
            setStatus('认领失败：' + claim.last_error);
            render();
            return;
          }
          if (claimPollAttempt >= 180) {
            if (claimPollTimer) {
              clearTimeout(claimPollTimer);
              claimPollTimer = null;
            }
            if (button) button.disabled = false;
            setStatus('认领 TikTok 采集箱轮询超时，请稍后刷新状态。');
            render();
            return;
          }
          setStatus((reason || '正在认领 TikTok 采集箱') + '，第 ' + claimPollAttempt + ' 次轮询...');
          claimPollTimer = setTimeout(tick, 2500);
        }).catch(function(e) {
          if (claimPollAttempt >= 180) {
            if (claimPollTimer) {
              clearTimeout(claimPollTimer);
              claimPollTimer = null;
            }
            if (button) button.disabled = false;
            setStatus('认领轮询失败：' + String(e));
            render();
            return;
          }
          claimPollTimer = setTimeout(tick, 2500);
        });
      }
      tick();
    }

      }).then(function(d) {

          setStatus('妙手草稿仍有待处理项：' + (d.blockers || []).join('；'));

        }
        miaoshouDraftPrepared = true;
        preview.miaoshou_draft = preview.miaoshou_draft || {};
        preview.miaoshou_draft.ready = true;
        preview.miaoshou_draft.change_summary = d.change_summary || {};
        preview.miaoshou_draft.blockers = d.blockers || [];
        setStatus('妙手二审草稿已准备：SKU ' + sku + '，' + count + ' 张图片；尚未写入妙手。');
        updateReviewStage();
      }).catch(function(e) {
        setStatus(String(e));
      }).finally(function() {
        button.disabled = false;
        if (button.textContent === '正在整理妙手草稿...') button.textContent = '继续：准备妙手二审';
      });
    }

    function commitMiaoshouDraft() {
      var button = document.getElementById('stageButton');
      button.disabled = true;
      button.textContent = '正在写入并验证...';
      setStatus('正在写入妙手公共采集箱；不会认领店铺或发布。');
      api('/api/new-product/miaoshou-draft/commit', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({offer_id: preview.offer_id})
      }).then(function(d) {
        if (!d.ok) throw new Error(d.error || '妙手写入失败');
        if (!d.verified) throw new Error('妙手已响应，但回读校验未全部通过');
        return refreshPreviewState(true);
      }).then(function() {
        button.textContent = '已进入妙手二审';
        setStatus('已写入妙手公共采集箱并验证；已自动刷新当前阶段。');
      }).catch(function(e) {
        setStatus(String(e));
        button.textContent = '重试写入妙手公共采集箱';
      }).finally(function() {
        button.disabled = false;
      });
    }

    function overseasLines() {
      return document.getElementById('overseasInput').value.split(/\r?\n/).map(function(x) { return x.trim(); }).filter(Boolean);
    }

    function saveOverseasLinks(fetchNow, quiet) {
      if (!preview) return Promise.resolve(true);
      var urls = overseasLines();
      if (!urls.length) return Promise.resolve(true);
      if (!quiet) setStatus(fetchNow ? '抓取海外素材中...' : '保存海外链接中...');
      return api('/api/new-product/overseas-sources', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({offer_id: preview.offer_id, overseas_urls: urls, fetch: !!fetchNow})
      }).then(function(d) {
        if (!d.ok) {
          if (!quiet) alert(d.error || '海外素材处理失败');
          pipelineFailures.push('海外素材: ' + (d.error || '处理失败'));
          return false;
        }
        preview = d;
        render();
        setStatus(fetchNow ? '海外素材抓取完成' : '海外链接已保存');
        return true;
      }).catch(function(e) {
        pipelineFailures.push('海外素材: ' + String(e));
        if (!quiet) alert(String(e));
        renderProgress();
        return false;
      });
    }

    function toggleImages() {
      showAllImages = !showAllImages;
      render();
    }

    function useOverseasTitle(idx) {
      var src = (preview.overseas_sources || [])[idx];
      if (!src || !src.title) return;
      document.getElementById('titleInput').value = src.title;
      saveReview(false);
    }

    function promoteOverseasImage(idx) {
      var img = (preview.review.overseas_image_candidates || [])[idx];
      if (!img) return;
      preview.review.image_actions = (preview.review.image_actions || []).concat([img]);
      saveReview(false);
    }

    window.addEventListener('DOMContentLoaded', function() {
      var q = new URLSearchParams(location.search);
      loadSessionStore();
      ensureAtLeastOneSession();
      applySession(sessionsById[activeSessionId]);
      refreshLiveFxRates(false).finally(function() {
        if (q.get('offer_id')) {
          var oid = q.get('offer_id');
          var hit = null;
          sessionOrder.forEach(function(id) {
            if (sessionsById[id] && String(sessionsById[id].offerId || '') === String(oid)) hit = id;
          });
          if (hit) {
            switchSession(hit);
          } else {
            document.getElementById('urlInput').value = oid;
            loadPreview();
          }
        }
        captureActiveSession();
        renderSessionBar();
        if (preview && preview.offer_id) refreshPreviewState(true).catch(function(e) { setStatus('刷新任务状态失败：' + String(e.message || e)); });
      });
      window.addEventListener('focus', function() {
        if (preview && preview.offer_id) refreshPreviewState(true).catch(function() {});
      });
      document.addEventListener('visibilitychange', function() {
        if (!document.hidden && preview && preview.offer_id) refreshPreviewState(true).catch(function() {});
      });
      window.addEventListener('beforeunload', function() {
        captureActiveSession();
      });
    });
  </script>
</body>
</html>
