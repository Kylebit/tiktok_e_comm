<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>任务工作台 · Orbit</title><link rel="stylesheet" href="/static/operations_shell.css"><link rel="stylesheet" href="/static/task_workspace.css"><script src="/static/operations_shell.js" defer></script><script src="/static/task_workspace.js" defer></script></head>
<body data-core="tasks"><main class="task-page">
<header class="page-heading"><div><p class="eyebrow">ORBIT · 运营任务</p><h1>任务工作台</h1><p class="muted">安排工作、处理审核，继续已有任务。</p></div><div class="buttons"><button id="refreshTasks">刷新</button><button class="primary" id="createTask">新建任务</button></div></header>
<div id="connection" class="notice" role="status">正在连接任务服务…</div><div id="pageError" role="alert" hidden></div>
<section class="summary" aria-label="任务概况"><button data-filter="current"><span>未取消记录</span><strong id="countCurrent">—</strong></button><button data-filter="all"><span>全部记录</span><strong id="countAll">—</strong></button><button data-filter="running"><span>执行中</span><strong id="countRunning">—</strong></button><button data-filter="attention"><span>待我处理</span><strong id="countAttention">—</strong></button><button data-filter="external"><span>历史观测</span><strong id="countExternal">—</strong></button><button data-filter="problem"><span>执行异常</span><strong id="countProblem">—</strong></button><button data-filter="completed"><span>已完成</span><strong id="countCompleted">—</strong></button><button data-filter="cancelled"><span>已取消历史</span><strong id="countCancelled">—</strong></button></section>
<section class="panel attention"><div class="section-heading"><h2>待我处理</h2><span class="muted">这里只列出需要你处理的事项；是否自动接续取决于执行器状态</span></div><div id="attentionList"><p class="empty">正在读取…</p></div></section>
<section class="panel"><div class="section-heading"><h2 id="taskListTitle">未取消记录</h2><div class="filters"><label class="sr-only" for="taskSearch">搜索任务</label><input id="taskSearch" type="search" placeholder="搜索任务、SKU 或采集箱"><label class="sr-only" for="taskType">任务类型</label><select id="taskType"><option value="">全部类型</option><option value="publication">商品上架</option><option value="delisting">商品下架</option><option value="profit">利润统计</option></select><select id="taskState" aria-label="任务状态"><option value="current">未取消记录（包含已完成）</option><option value="all">全部记录（含已取消）</option><option value="running">执行中</option><option value="waiting">等待平台结果</option><option value="attention">待我处理</option><option value="external">历史观测（非实时）</option><option value="problem">执行异常</option><option value="queued">待执行</option><option value="completed">已完成</option><option value="cancelled">已取消历史</option></select></div></div><div class="table-scroll"><table><thead><tr><th>任务 / 范围</th><th>当前步骤</th><th>状态</th><th>来源 / 观测或更新</th><th>操作</th></tr></thead><tbody id="taskRows"></tbody></table></div><p id="listEmpty" class="empty" hidden></p></section>
<details class="panel pending-checks" id="pendingChecks" hidden><summary><strong>待核队列</strong> <span id="pendingChecksCount" class="badge">0</span><span class="pending-overview-hint">展开完整线索 · 不会自动重试或解锁</span></summary><p class="pending-count-note muted">按线索计数，同一任务可同时有异常与资料缺口；不计入“待我处理”，不会自动重试或解锁</p><div id="pendingChecksList"></div></details>
<details id="domainOperations" class="runtime" hidden><summary id="domainOperationsTitle">历史业务操作待回读</summary><div id="domainOperationsList"></div></details>
<details class="runtime"><summary>运行版本</summary><div id="releaseInfo">尚未读取</div></details>
</main>
<dialog id="createDialog"><form id="createForm"><div class="dialog-heading"><h2>新建运营任务</h2><button type="button" data-close="createDialog" aria-label="关闭">×</button></div><p id="creationStatus" class="muted">任务会保存；后台接续能力尚未核实。</p><label>任务类型<select id="newType"><option value="publication">商品上架</option><option value="delisting">商品下架</option><option value="profit">利润统计</option></select></label><label>任务名称<input id="newTitle" required maxlength="200" placeholder="例如：八月 TK 和 Shopee 利润"></label><label id="offerField">采集箱 Offer ID<input id="newOffer" inputmode="numeric" pattern="[0-9]+" title="采集箱 ID 只填写数字，例如 3956742887" placeholder="例如：3956742887"></label><label id="skuField" hidden>内部 SKU<textarea id="newSkus" rows="2" placeholder="每行一个，保留前导零，例如 0001"></textarea></label><label id="monthField" hidden>统计月份<input id="newMonth" type="month"></label><label>平台 / 店铺范围<textarea id="newShops" rows="2" placeholder="每行一个准确的店铺名称或 ID"></textarea></label><p id="scopeHint" class="muted">请填写已确定范围；缺少精确身份时，任务先核实范围。</p><div id="createError" role="alert"></div><div class="buttons end"><button type="button" data-close="createDialog">取消</button><button id="submitTask" class="primary" type="submit">创建任务</button></div></form></dialog>
<dialog id="detailDialog"><div class="dialog-heading"><h2 id="detailTitle">任务详情</h2><button type="button" data-close="detailDialog" aria-label="关闭">×</button></div><div id="detailBody"></div><div id="detailError" role="alert"></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>
</body></html>
